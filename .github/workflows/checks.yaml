name: Linter and Type Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checks:
    name: Run Linter and Type Checks
    # Pin to a specific Ubuntu version for stable and consistent builds
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint mypy

      - name: Run Linter (pylint)
        run: pylint --rcfile=.pylintrc .

      - name: Run Type Checker (mypy)
        # 'if: always()' forces mypy to run even if the linter fails
        if: always()
        run: mypy .
